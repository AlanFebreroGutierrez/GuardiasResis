<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Esquema de Guardias - Hospital Provincial de Neuquén</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --border: #cbd5e1;
      --weekend: #fef3c7;
      --holiday: #fee2e2;
    }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .container { max-width: 1140px; margin: 0 auto; }
    h1, h2, h3 { margin-top: 0; }
    .hospital-sub { color: var(--muted); font-size: 0.95rem; margin-top: -10px; margin-bottom: 20px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.05);
    }
    .row { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
    label { font-weight: 600; font-size: 0.88rem; display: block; margin-bottom: 4px; }
    input, select, button {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.95rem;
    }
    button {
      background: var(--primary);
      color: #fff;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: 0.18s;
    }
    button:hover:not(:disabled) { background: var(--primary-hover); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    button.secondary { background: #475569; }
    button.secondary:hover:not(:disabled) { background: #334155; }
    button.danger { background: #dc2626; }
    button.success { background: #16a34a; }
    button.success:hover:not(:disabled) { background: #15803d; }

    /* Selector de 5 colores */
    .color-picker-group { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .color-option {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 11px;
      border-radius: 8px;
      border: 2px solid transparent;
      background: #f8fafc;
      color: #0f172a;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .color-option.active {
      border-color: #0f172a;
      background: #e2e8f0;
    }
    .color-option.taken {
      opacity: 0.42;
      cursor: not-allowed;
      text-decoration: line-through;
    }
    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.2);
    }

    /* Grilla calendario semanal (Lun a Dom) */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 8px;
      margin-top: 12px;
    }
    .cal-header {
      text-align: center;
      font-weight: 700;
      padding: 7px;
      background: #e2e8f0;
      border-radius: 8px;
      font-size: 0.82rem;
      color: #334155;
    }
    .cal-empty {
      min-height: 64px;
      background: transparent;
    }
    .day-cell-btn {
      min-height: 64px;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 6px;
      text-align: center;
      cursor: pointer;
      font-size: 0.8rem;
      user-select: none;
      background: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2px;
    }
    .day-cell-btn.weekend {
      background: var(--weekend);
      border-color: #f59e0b;
    }
    .day-cell-btn.holiday {
      background: var(--holiday);
      border-color: #ef4444;
      color: #991b1b;
      font-weight: 700;
    }
    .day-cell-btn.blocked-ART { background: #dbeafe; border-color: #3b82f6; color: #1e3a8a; font-weight: 700; }
    .day-cell-btn.blocked-ENF { background: #fce7f3; border-color: #ec4899; color: #831843; font-weight: 700; }
    .day-cell-btn.blocked-IMP { background: #f3e8ff; border-color: #a855f7; color: #581c87; font-weight: 700; }

    /* Resultado final */
    .cal-cell {
      min-height: 112px;
      border: 1px solid rgba(15, 23, 42, 0.14);
      border-radius: 12px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: #fff;
    }
    .cal-cell.uncovered { background: #f8fafc; color: #94a3b8; border-style: dashed; }
    .cal-top { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
    .cal-date { font-weight: 800; font-size: 0.85rem; }
    .badge {
      font-size: 0.62rem;
      padding: 2px 6px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.78);
      color: #fff;
      font-weight: 700;
    }
    .shared-pill {
      display: inline-block;
      font-size: 0.64rem;
      font-weight: 700;
      color: #0f172a;
      background: rgba(255, 255, 255, 0.88);
      border-radius: 999px;
      padding: 1px 6px;
      margin-bottom: 4px;
    }
    .guard-box {
      text-align: center;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 8px;
      padding: 6px 4px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
    }
    .guard-names {
      font-weight: 800;
      font-size: 0.9rem;
      color: #0f172a;
      line-height: 1.2;
    }
    .shift-times {
      font-size: 0.66rem;
      font-weight: 600;
      color: #475569;
      margin-top: 2px;
    }

    table { width: 100%; border-collapse: collapse; margin-top: 12px; font-size: 0.9rem; }
    th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
    th { background: #f1f5f9; }
    .color-dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; border: 1px solid rgba(0,0,0,0.2); }
    .alert { padding: 12px 14px; border-radius: 10px; margin-bottom: 15px; font-weight: 500; }
    .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .alert-success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .alert-warn { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
  </style>
</head>
<body>
<div class="container">
  <h1>🏥 Esquema de Guardias — Residentes</h1>
  <p class="hospital-sub"><strong>Hospital Provincial de Neuquén</strong> · Turnos de 12 hs (08:00–20:00 y 20:01–07:59)</p>

  <!-- PASO 0: PERÍODO -->
  <div class="card" id="step-period">
    <h2>1. Período</h2>
    <div class="row">
      <div>
        <label>Mes de inicio (día 15):</label>
        <select id="startMonth" onchange="syncEndMonth()">
          <option value="0">Enero</option><option value="1">Febrero</option>
          <option value="2">Marzo</option><option value="3">Abril</option>
          <option value="4">Mayo</option><option value="5">Junio</option>
          <option value="6">Julio</option><option value="7">Agosto</option>
